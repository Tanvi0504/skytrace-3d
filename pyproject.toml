[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skytrace-3d"
version = "0.10.0"
description = "SkyTrace — single-pass drone-video 3D reconstruction integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "ultralytics>=8.3,<9",
  "lap>=0.5.12,<1",
  "torch==2.5.1",
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "pipeline*", "skytrace*", "evaluation*"]
